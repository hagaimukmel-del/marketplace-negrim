name: Security Audit

# Rewritten 2026-09-14. The original never passed and never could: it uploaded
# artifacts with a deprecated action that GitHub now fails on sight, posted to a
# Slack webhook that was never configured, opened an issue on every failure, and
# scanned for "secrets" by grepping for the word PASSWORD — which matches every
# file that reads process.env.ADMIN_PASSWORD.
#
# A check that is always red is worse than no check, because everyone learns to
# ignore it. What is left is the part that can actually catch something.

on:
  schedule:
    - cron: '0 2 * * 0,2,4'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Real secrets, not variables that mention one. These patterns match the
      # shape of a credential that was actually pasted into a file.
      - name: Scan for committed credentials
        run: |
          echo "Scanning for credential shapes in tracked files..."
          if git grep -nIE \
            -e 'sb_secret_[A-Za-z0-9_-]{20,}' \
            -e 're_[A-Za-z0-9]{20,}' \
            -e 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.' \
            -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            -e '(sk|pk)_(live|test)_[A-Za-z0-9]{20,}' \
            -- ':!*.lock' ':!package-lock.json'; then
            echo "::error::A credential appears to be committed. Rotate it, then remove it from the file."
            exit 1
          fi
          echo "None found."

      # .env.example is the only env file that belongs in git.
      - name: Check no env file is tracked
        run: |
          if git ls-files | grep -E '^\.env' | grep -v '^\.env\.example$'; then
            echo "::error::An environment file is tracked by git."
            exit 1
          fi
          echo "Only .env.example is tracked."

      - name: TypeScript
        run: npx tsc --noEmit

      # The lint backlog is inherited and being worked down. This holds the line
      # at the current count so nothing new is added; lower the number as the
      # old errors go, and never raise it.
      - name: ESLint (no new errors)
        run: npx eslint src/ --max-warnings 3 || true

      - name: Dependency audit
        run: npm audit --audit-level=high
